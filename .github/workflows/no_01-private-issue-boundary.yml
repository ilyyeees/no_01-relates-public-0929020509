name: no_01 private issue relationship boundary

on:
  push:
    paths:
      - .github/workflows/no_01-private-issue-boundary.yml

permissions:
  contents: read
  issues: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Test dependency and sub-issue authorization
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PUBLIC_ISSUE_NUMBER: "1"
          PRIVATE_ISSUE_ID: "5623948375"
        shell: bash
        run: |
          set -u
          api="https://api.github.com/repos/${REPOSITORY}/issues/${PUBLIC_ISSUE_NUMBER}"
          headers=(
            --header "Authorization: Bearer ${GH_TOKEN}"
            --header 'Accept: application/vnd.github+json'
            --header 'X-GitHub-Api-Version: 2026-03-10'
            --header 'Content-Type: application/json'
          )

          control_status=$(curl --silent --show-error --output control.json --write-out '%{http_code}' \
            --request POST "${headers[@]}" \
            --data '{"body":"no_01 scoped issue-write control"}' \
            "${api}/comments")
          control_id=$(jq -r '.id // empty' control.json)
          control_delete_status=not_created
          if [[ -n "$control_id" ]]; then
            control_delete_status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
              --request DELETE "${headers[@]}" \
              "https://api.github.com/repos/${REPOSITORY}/issues/comments/${control_id}")
          fi
          printf '::notice title=Issue token control::create=%s delete=%s\n' \
            "$control_status" "$control_delete_status"

          jq -n --argjson id "$PRIVATE_ISSUE_ID" '{issue_id: $id}' > dependency-request.json
          dependency_status=$(curl --silent --show-error --output dependency-response.json --write-out '%{http_code}' \
            --request POST "${headers[@]}" --data-binary @dependency-request.json \
            "${api}/dependencies/blocked_by")
          dependency_id_match=$(jq --argjson id "$PRIVATE_ISSUE_ID" '.id == $id' dependency-response.json 2>/dev/null || printf false)
          dependency_body_present=$(jq '(.body // "") | length > 0' dependency-response.json 2>/dev/null || printf false)
          dependency_body_sha=$(jq -r '.body // ""' dependency-response.json 2>/dev/null | sha256sum | cut -d ' ' -f 1)
          printf '::notice title=Dependency create::status=%s private_id_match=%s body_present=%s body_sha256=%s\n' \
            "$dependency_status" "$dependency_id_match" "$dependency_body_present" "$dependency_body_sha"

          dependency_list_status=$(curl --silent --show-error --output dependency-list.json --write-out '%{http_code}' \
            --request GET "${headers[@]}" "${api}/dependencies/blocked_by")
          dependency_list_match=$(jq --argjson id "$PRIVATE_ISSUE_ID" '[.[] | select(.id == $id)] | length' dependency-list.json 2>/dev/null || printf 0)
          printf '::notice title=Dependency list::status=%s private_matches=%s count=%s\n' \
            "$dependency_list_status" "$dependency_list_match" \
            "$(jq 'length' dependency-list.json 2>/dev/null || printf 0)"

          dependency_cleanup_status=not_created
          if [[ "$dependency_status" == 201 ]]; then
            dependency_cleanup_status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
              --request DELETE "${headers[@]}" \
              "${api}/dependencies/blocked_by/${PRIVATE_ISSUE_ID}")
          fi
          printf '::notice title=Dependency cleanup::status=%s\n' "$dependency_cleanup_status"

          jq -n --argjson id "$PRIVATE_ISSUE_ID" '{sub_issue_id: $id}' > sub-issue-request.json
          sub_issue_status=$(curl --silent --show-error --output sub-issue-response.json --write-out '%{http_code}' \
            --request POST "${headers[@]}" --data-binary @sub-issue-request.json \
            "${api}/sub_issues")
          sub_issue_id_match=$(jq --argjson id "$PRIVATE_ISSUE_ID" '.id == $id' sub-issue-response.json 2>/dev/null || printf false)
          sub_issue_body_present=$(jq '(.body // "") | length > 0' sub-issue-response.json 2>/dev/null || printf false)
          sub_issue_body_sha=$(jq -r '.body // ""' sub-issue-response.json 2>/dev/null | sha256sum | cut -d ' ' -f 1)
          printf '::notice title=Sub-issue create::status=%s private_id_match=%s body_present=%s body_sha256=%s\n' \
            "$sub_issue_status" "$sub_issue_id_match" "$sub_issue_body_present" "$sub_issue_body_sha"

          sub_issue_list_status=$(curl --silent --show-error --output sub-issue-list.json --write-out '%{http_code}' \
            --request GET "${headers[@]}" "${api}/sub_issues")
          sub_issue_list_match=$(jq --argjson id "$PRIVATE_ISSUE_ID" '[.[] | select(.id == $id)] | length' sub-issue-list.json 2>/dev/null || printf 0)
          printf '::notice title=Sub-issue list::status=%s private_matches=%s count=%s\n' \
            "$sub_issue_list_status" "$sub_issue_list_match" \
            "$(jq 'length' sub-issue-list.json 2>/dev/null || printf 0)"

          sub_issue_cleanup_status=not_created
          if [[ "$sub_issue_status" == 201 ]]; then
            sub_issue_cleanup_status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
              --request DELETE "${headers[@]}" --data-binary @sub-issue-request.json \
              "${api}/sub_issue")
          fi
          printf '::notice title=Sub-issue cleanup::status=%s\n' "$sub_issue_cleanup_status"
